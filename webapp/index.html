<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aventura</title>
  <style>
    :root {
      --bg: #0a0c10;
      --text: #d8dee9;
      --muted: #6b7280;
      --accent: #7aa2f7;
      --choice: #bb9af7;
      --you: #9ece6a;
      --danger: #f7768e;
      --line: #1f2335;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.65;
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100dvh;
    }
    #story {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .beat {
      margin-bottom: 1.15em;
      opacity: 0;
      animation: fadeIn 0.45s ease forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .beat.you {
      color: var(--you);
      font-style: italic;
    }
    .beat.choice-title {
      color: var(--choice);
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 1.5em;
      margin-bottom: 0.4em;
    }
    .beat.danger { color: var(--danger); }
    .beat.muted { color: var(--muted); font-size: 0.92em; }

    #bottom {
      border-top: 1px solid var(--line);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--bg);
    }
    #choices {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    #choices.visible { display: flex; }
    .choice-btn {
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .choice-btn:active, .choice-btn:hover {
      border-color: var(--choice);
      color: var(--choice);
    }
    #input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      background: #12151c;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }
    #send {
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      background: var(--accent);
      color: #0a0c10;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #send:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="story"></div>
  <div id="bottom">
    <div id="choices"></div>
    <div id="input-row">
      <input id="input" type="text" placeholder="O escribe otra cosa…" autocomplete="off" enterkeyhint="send" />
      <button id="send">→</button>
    </div>
  </div>

  <script src="tech_db.js"></script>
  <script src="cards_db.js"></script>
  <script src="engine.js"></script>
  <script src="ollama.js"></script>
  <script src="app.js"></script>
</body>
</html>
