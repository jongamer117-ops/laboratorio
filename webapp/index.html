<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aventura</title>
  <style>
    :root {
      --bg: #10141b;
      --surface: #1a2030;
      --text: #e8edf5;
      --muted: #c5cedb;
      --accent: #9ec1ff;
      --accent-ink: #0d1524;
      --choice: #ddd0ff;
      --you: #b7e3b0;
      --danger: #ffb4c2;
      --good: #9ed8b4;
      --world: #9ad4e4;
      --line: #8e9bb3;
      --line-soft: #2c3548;
      --chip-ink: #10141b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body { overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      max-width: 40rem;
      margin: 0 auto;
      min-height: 100dvh;
      caret-color: var(--accent);
    }
    ::selection { background: #3d5f93; color: #f4f7fb; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    #story {
      scrollbar-color: #5d6b86 transparent;
    }

    #hud {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      border-bottom: 1px solid var(--line-soft);
      padding: 8px 14px 8px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
    }
    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #hud-name {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.015em;
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hp {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      flex: none;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .hp-track {
      width: 42px;
      height: 6px;
      border-radius: 99px;
      background: #2a3346;
      overflow: hidden;
    }
    .hp-fill {
      display: block;
      height: 100%;
      width: 100%;
      transform: scaleX(var(--hp, 0));
      transform-origin: left center;
      background: var(--danger);
    }
    .hp-fill.is-ok { background: var(--good); }
    .hp-fill.is-mid { background: #e6c27a; }
    #hud-meta {
      margin: 3px 0 6px;
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      line-height: 1.3;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-actions {
      gap: 6px;
    }
    .seed {
      margin: 0;
      min-width: 0;
      flex: 1;
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      font-size: 0.72rem;
      line-height: 1.2;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .seed span { color: var(--text); }
    .text-btn {
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      line-height: 1.2;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 32px;
      cursor: pointer;
      flex: none;
    }
    .text-btn:disabled { color: var(--muted); border-color: var(--line-soft); cursor: default; }

    #story {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .year-block { margin: 0 0 0.4rem; }
    .year-title {
      margin: 1.05rem 0 0.35rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--choice);
    }
    .year-block:first-child .year-title { margin-top: 0.35rem; }
    .beat {
      margin: 0 0 0.75em;
    }
    .beat.is-new {
      animation: rise 0.35s ease-out;
    }
    @keyframes rise {
      from { opacity: 0.45; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .beat.you {
      color: var(--you);
      font-style: italic;
    }
    .beat.flavor { color: var(--text); }
    .beat.danger { color: var(--danger); }
    .beat.muted { color: var(--muted); font-size: 0.98em; }
    .chip {
      display: inline-block;
      margin-right: 0.4em;
      padding: 0.05em 0.45em 0.08em;
      border-radius: 99px;
      font-family: system-ui, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.01em;
      line-height: 1.4;
      vertical-align: 0.12em;
      color: var(--chip-ink);
      background: #d5dbe8;
    }
    .chip-good { background: #b7e3c4; }
    .chip-danger { background: #ffc2cc; }
    .chip-choice { background: #ddd0ff; }
    .chip-world { background: #b7e4ef; }
    .chip-info { background: #c9d7f5; }
    .chip-muted { background: #d5dbe8; color: #1a2030; }
    .world-fold {
      margin: 0 0 0.75em;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: #141a26;
    }
    .world-fold summary {
      cursor: pointer;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 8px 10px;
      list-style-position: inside;
    }
    .world-body { padding: 0 10px 4px; }
    .world-body .beat { font-size: 0.95em; }

    #bottom {
      border-top: 1px solid var(--line-soft);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
    }
    .status {
      margin: 0 0 6px;
      min-height: 0;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--accent);
    }
    .status:empty { margin: 0; height: 0; overflow: hidden; }
    .choice-caption {
      margin: 0 0 6px;
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      color: var(--choice);
    }
    #choices {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    #choices.visible { display: flex; }
    .choice-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      line-height: 1.3;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      min-height: 40px;
      cursor: pointer;
    }
    .choice-btn:hover { border-color: var(--choice); }
    .choice-btn:active { background: #222838; }
    .choice-btn:disabled,
    .choice-btn.is-disabled {
      color: var(--muted);
      border-color: var(--line-soft);
      cursor: not-allowed;
    }
    .choice-detail {
      font-size: 0.75rem;
      line-height: 1.35;
      color: var(--muted);
    }
    #composer {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      min-width: 0;
      font-family: system-ui, sans-serif;
      font-size: max(1rem, 1em);
      line-height: 1.3;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      min-height: 44px;
    }
    #input::placeholder { color: var(--muted); opacity: 1; }
    #send {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      padding: 0;
    }
    #send svg { display: block; }
    #send:disabled {
      background: #3d4d6e;
      color: #d5deec;
      cursor: default;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .beat.is-new { animation: none; }
    }
  </style>
</head>
<body>
  <header id="hud">
    <div class="hud-row">
      <h1 id="hud-name">…</h1>
      <p class="hp">
        <span class="hp-track" aria-hidden="true"><span class="hp-fill" id="hp-fill"></span></span>
        <span id="hp-text">—</span>
        <span class="sr-only">puntos de vida</span>
      </p>
    </div>
    <p id="hud-meta">Año —</p>
    <div class="hud-row hud-actions">
      <p class="seed">Semilla <span id="hud-seed">—</span></p>
      <button type="button" id="new-game" class="text-btn">Nueva partida</button>
      <button type="button" id="advance" class="text-btn">Avanzar año</button>
    </div>
  </header>

  <main id="story" aria-live="off"></main>

  <div id="bottom">
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="choice-caption" class="choice-caption" hidden></p>
    <div id="choices" role="group" aria-label="Opciones"></div>
    <form id="composer" autocomplete="off">
      <label class="sr-only" for="input">Acción libre</label>
      <input id="input" name="accion" type="text" maxlength="160" placeholder="O escribe otra cosa…" autocomplete="off" enterkeyhint="send" spellcheck="true" />
      <button id="send" type="submit" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path d="M3 9h12M11 5l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="tech_db.js"></script>
  <script src="cards_db.js"></script>
  <script src="engine.js"></script>
  <script src="spatial.js"></script>
  <script src="ollama.js"></script>
  <script src="app.js"></script>
</body>
</html>
